name: 问题反馈
description: 报告可以复现的问题，请勿附带密钥或客户抓包。
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 应用版本、Windows 版本、TShark 版本、安装版或源码运行。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请优先提供最小合成样本的生成步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 信息检查
      options:
        - label: 已移除密钥、账号、客户抓包和其他敏感信息。
          required: true
